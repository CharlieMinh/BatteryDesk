name: Device compatibility
description: Share a battery-reading result for a peripheral or report a compatibility issue.
title: "[Device] "
body:
  - type: input
    id: model
    attributes:
      label: Manufacturer and exact model
    validations:
      required: true
  - type: dropdown
    id: transport
    attributes:
      label: Connection used
      options:
        - Bluetooth
        - USB receiver
        - USB cable
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - Works as expected
        - Works partly or intermittently
        - Shows no battery reading
        - Shows an incorrect reading
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Observed behavior and optional support summary
      description: Preview the app's support summary before pasting. Omit serial numbers, Bluetooth addresses, and personal names.
    validations:
      required: true
