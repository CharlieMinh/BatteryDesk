name: Windows build and candidate package

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build BatteryDesk.slnx -c Release
      - name: Test
        run: dotnet test BatteryDesk.slnx -c Release --no-build
      - name: Package a tagged candidate
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: ./scripts/Publish-Windows.ps1 -Version ($env:GITHUB_REF_NAME.Substring(1))
      - name: Verify the portable candidate
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $archive = Join-Path $PWD "artifacts/BatteryDesk-$($env:GITHUB_REF_NAME.Substring(1))-win-x64.zip"
          $checksum = ((Get-Content -LiteralPath "$archive.sha256" -Raw).Trim() -split '\s+')[0]
          if ((Get-FileHash -LiteralPath $archive).Hash -ne $checksum) { throw 'ZIP checksum mismatch.' }
          $unpacked = Join-Path $env:RUNNER_TEMP 'BatteryDesk-portable'
          Expand-Archive -LiteralPath $archive -DestinationPath $unpacked
          foreach ($name in 'BatteryDesk.exe', 'coreclr.dll', 'System.Windows.Forms.dll', 'LICENSE') {
            if (!(Test-Path -LiteralPath (Join-Path $unpacked $name) -PathType Leaf)) { throw "Missing $name." }
          }
          $env:DOTNET_ROOT = Join-Path $unpacked 'no-system-runtime'
          $env:DOTNET_ROOT_X64 = $env:DOTNET_ROOT
          & (Join-Path $unpacked 'BatteryDesk.Probe.exe') --usb-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload the ZIP and its checksum
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: BatteryDesk-win-x64
          path: |
            artifacts/BatteryDesk-*-win-x64.zip
            artifacts/BatteryDesk-*-win-x64.zip.sha256
          if-no-files-found: error
